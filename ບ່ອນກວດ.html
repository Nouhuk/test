<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <title>ระบบตรวจข้อสอบ - สำหรับอาจารย์</title>
    <link href="https://fonts.googleapis.com/css2?family=Phetsarath&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, input, button { font-family: 'Phetsarath', 'Noto Sans', sans-serif; }
        body { padding: 20px; max-width: 800px; margin: 0 auto; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .ans-box { background: #f0f4f8; padding: 10px; border-left: 4px solid #007bff; margin: 5px 0 15px 0; }
        input[type="number"] { width: 60px; padding: 5px; font-size: 16px; }
        .save-btn { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>👨‍🏫 หน้าสำหรับอาจารย์ตรวจข้อสอบ (Teacher Portal)</h2>
    <div id="examContent"></div>

    <script>
        function loadSubmission() {
            const data = JSON.parse(localStorage.getItem('examSubmission'));
            const container = document.getElementById('examContent');

            if (!data) {
                container.innerHTML = "<p>ຍັງບໍ່ທັນມີນັກຮຽນສົ່ງຄຳຕອບເຂົ້າມາ</p>";
                return;
            }

            container.innerHTML = `
                <div class="card">
                    <h3>ນັກຮຽນ: ${data.name} (ຫ້ອງ ${data.className})</h3>
                    <p><small>ເວລາທີ່ສົ່ງ: ${data.submittedAt}</small></p>
                    <hr>
                    <p><b>ຕະແນນບ່ອນຕົວເລືອກ (Choice):</b> ${data.choiceScore} / 3 ຄະແນນ</p>
                </div>

                <div class="card">
                    <h4>📝 ກວດຂໍ້ຂຽນ (Essay Verification)</h4>
                    
                    <p><b>ຂໍ້ 1: ຄອມພິວເຕີໝາຍເຖິງຫຍັງ?</b></p>
                    <div class="ans-box">${data.ans1}</div>
                    ໃຫ້ຄະແນນຂໍ້ 1 (0-1 ຄະແນນ): <input type="number" id="score1" min="0" max="1" value="0">

                    <p><b>ຂໍ້ 2: ຊອບແວໝາຍເຖິງຫຍັງ?</b></p>
                    <div class="ans-box">${data.ans2}</div>
                    ໃຫ້ຄະແນນຂໍ້ 2 (0-1 ຄະແນນ): <input type="number" id="score2" min="0" max="1" value="0">

                    <p><b>ຂໍ້ 3: ຄອມພິວເຕີຈຳແນກອອກເປ໊ນ 4 ຊະນິດຄື:</b></p>
                    <div class="ans-box">${data.ans3}</div>
                    ໃຫ້ຄະແນນຂໍ້ 3 (0-1 ຄະແນນ): <input type="number" id="score3" min="0" max="1" value="0">

                    <br><br>
                    <button class="save-btn" onclick="saveFinalScore(${data.choiceScore})">ລວມແລະບັນທຶກຄະແນນທັງໝົດ</button>
                </div>

                <div id="finalScoreCard" class="card" style="display:none; background:#d4edda; color:#155724;"></div>
            `;
        }

        function saveFinalScore(choiceScore) {
            const s1 = parseFloat(document.getElementById('score1').value) || 0;
            const s2 = parseFloat(document.getElementById('score2').value) || 0;
            const s3 = parseFloat(document.getElementById('score3').value) || 0;
            const essayTotal = s1 + s2 + s3;
            const grandTotal = choiceScore + essayTotal;

            const resCard = document.getElementById('finalScoreCard');
            resCard.style.display = 'block';
            resCard.innerHTML = `
                <h3>📊 ຜົນຮັບຄະແນນສຸດທ້າຍ:</h3>
                <ul>
                    <li>ຄະແນນຕົວເລືອກ: ${choiceScore} / 3 คะแนน</li>
                    <li>ຄະແນນຄຳຕອບ: ${essayTotal} / 3 คะแนน</li>
                    <li><b>ລວມຄະແນນທັງໝົດ: ${grandTotal} / 6 คะแนน</b></li>
                </ul>
            `;
        }
        loadSubmission();
    </script>
</body>
</html>
